<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    // Polyfill `process` for browser environment and inject the API key.
    // In a no-build-step setup, Node.js-style environment variables like `process.env`
    // are not available by default. This script prevents a `ReferenceError` when the
    // application code tries to access `process.env.API_KEY`.
    if (typeof window.process === 'undefined') {
      window.process = { env: {} };
    }
    // WARNING: This is for local development and demonstration purposes only.
    // Do not commit API keys directly into your source code in a real application.
    window.process.env.API_KEY = "AIzaSyD0pYC3WbVPs0MbYc87shubccb8Bs-S9b0";
  </script>
  <script>
    // Hide the specific Babel warning in this no-build-step environment.
    // This is a pragmatic solution to keep the console clean for this simulator
    // where a build step is intentionally avoided. The warning is expected behavior.
    const originalWarn = console.warn;
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('in-browser Babel transformer')) {
        return;
      }
      originalWarn.apply(console, args);
    };
  </script>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YIN Trade Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* "Imperial" Light Theme - Ultra-Professional & High-End */
      --base-100: 249 250 251; /* Gray-50: Crisp, clean canvass */
      --base-200: 255 255 255; /* Pure white for cards */
      --base-300: 243 244 246; /* Gray-100: Soft separations */
      --base-content: 71 85 105; /* Slate-600: Refined readability */
      --text-strong: 15 23 42; /* Slate-900: Authoritative headings */
      --primary: 37 99 235; /* Blue-600: Global Finance Blue */
      --secondary: 79 70 229; /* Indigo-600: Sophisticated Secondary */
      --accent: 13 148 136; /* Teal-600: Modern Accent */
      --success: 5 150 105; /* Emerald-600: Wealth Green */
      --error: 225 29 72; /* Rose-600: Error Pink-Red */
      --info: 2 132 199; /* Sky-600: Trust Blue */
      
      --glass-bg: 255 255 255 / 0.7;
      --glass-border: 255 255 255 / 0.4;
      --shadow-sm: 0 2px 4px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    [data-theme="dark"] {
      --base-100: 2 6 23; /* Slate-950: Deep space */
      --base-200: 15 23 42; /* Slate-900: Professional dark surface */
      --base-300: 30 41 59; /* Slate-800: Defined borders */
      --base-content: 148 163 184; /* Slate-400: Soft dark text */
      --text-strong: 248 250 252; /* Slate-50: Bright dark mode text */
      --primary: 96 165 250; /* Blue-400: Vibrant dark theme blue */
      --secondary: 129 140 248; /* Indigo-400: Sophisticated dark tone */
      --accent: 45 212 191; /* Teal-400: Modern dark accent */
      --success: 52 211 153; /* Emerald-400 */
      --error: 251 113 133; /* Rose-400 */
      --info: 56 189 248; /* Sky-400 */
      
      --glass-bg: 15 23 42 / 0.6;
      --glass-border: 255 255 255 / 0.05;
    }

    .glass-card {
      background-color: rgb(var(--base-200) / 0.7);
      backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgb(var(--base-300));
      box-shadow: var(--shadow-lg);
    }

    [data-theme="dark"] .glass-card {
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .themed-bg-gradient {
      background-image: linear-gradient(to right, rgb(var(--primary) / 0.8), rgb(var(--secondary) / 0.8));
    }

    .themed-bg-shimmer {
      background: linear-gradient(-45deg, rgb(var(--base-100)), rgb(var(--base-200)), rgb(var(--base-100)), rgb(var(--base-300) / 0.5));
      background-size: 400% 400%;
      animation: gradient-shimmer 15s ease infinite;
    }

    /* Animation Keyframes */
    @keyframes gradient-shimmer {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shake {

      10%,
      90% {
        transform: translate3d(-1px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(2px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-4px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(4px, 0, 0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flash-success {

      0%,
      100% {
        background-color: transparent;
      }

      50% {
        background-color: rgb(var(--success) / 0.2);
      }
    }

    @keyframes flash-error {

      0%,
      100% {
        background-color: transparent;
      }

      50% {
        background-color: rgb(var(--error) / 0.2);
      }
    }

    @keyframes stroke-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes pulse-highlight {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgb(var(--primary) / 0.7);
        opacity: 0.9;
      }

      50% {
        box-shadow: 0 0 15px 4px rgb(var(--primary) / 0.4), 0 0 0 5px rgb(var(--primary) / 1);
        opacity: 1;
      }
    }

    /* Checkmark Animation Classes */
    .checkmark-circle {
      stroke-dasharray: 157;
      stroke-dashoffset: 157;
      animation: stroke-draw 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark-check {
      stroke-dasharray: 36;
      stroke-dashoffset: 36;
      animation: stroke-draw 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.5s forwards;
    }


    /* Animation Utility Classes */
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.6s ease-out forwards;
      opacity: 0;
      /* Start hidden */
    }

    .animate-flash-success {
      animation: flash-success 0.8s ease-out;
    }

    .animate-flash-error {
      animation: flash-error 0.8s ease-out;
    }

    .animate-shake {
      animation: shake 0.7s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes zoom-slow {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.05);
      }
    }

    .animate-zoom-slow {
      animation: zoom-slow 20s infinite alternate ease-in-out;
    }


    /* Onboarding Tour Styles */
    .onboarding-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(10, 10, 20, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      animation: fade-in 0.3s ease-out;
    }

    .onboarding-spotlight-wrapper {
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      /* Allows clicks to pass through to backdrop */
    }

    .onboarding-spotlight {
      position: absolute;
      border-radius: 1rem;
      box-shadow: 0 0 0 9999px rgba(10, 10, 20, 0.7);
      transition: top 0.4s ease-in-out, left 0.4s ease-in-out, width 0.4s ease-in-out, height 0.4s ease-in-out;
    }

    .onboarding-highlight-pulse {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      animation: pulse-highlight 2.5s infinite ease-in-out;
    }

    .onboarding-tooltip {
      position: absolute;
      z-index: 52;
      transition: top 0.4s ease-in-out, left 0.4s ease-in-out, transform 0.4s ease-in-out, opacity 0.3s ease-out;
    }
    /* Touch-friendly: improve tap target sizes */
    @media (max-width: 640px) {
      button, [role="button"] {
        min-height: 36px;
      }
    }

    /* Scrollbar hide utility */
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Smooth scrolling */
    html { scroll-behavior: smooth; }

    /* Prevent horizontal overflow on mobile */
    /* Prevent horizontal overflow on mobile */
    body { 
      overflow-x: hidden; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Professional Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgb(var(--base-300));
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgb(var(--base-content) / 0.3);
      background-clip: content-box;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const toRGB = (hex) => {
      let c;
      if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
        c = hex.substring(1).split('');
        if (c.length == 3) {
          c = [c[0], c[0], c[1], c[1], c[2], c[2]];
        }
        c = '0x' + c.join('');
        return [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(' ');
      }
      throw new Error('Bad Hex');
    }

    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          screens: {
            'xs': '480px', // Extra-small breakpoint for small phones
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            'base-100': 'rgb(var(--base-100) / <alpha-value>)',
            'base-200': 'rgb(var(--base-200) / <alpha-value>)',
            'base-300': 'rgb(var(--base-300) / <alpha-value>)',
            'base-content': 'rgb(var(--base-content) / <alpha-value>)',
            'text-strong': 'rgb(var(--text-strong) / <alpha-value>)',
            'primary': 'rgb(var(--primary) / <alpha-value>)',
            'secondary': 'rgb(var(--secondary) / <alpha-value>)',
            'accent': 'rgb(var(--accent) / <alpha-value>)',
            'success': 'rgb(var(--success) / <alpha-value>)',
            'warning': '#FBBD23',
            'error': 'rgb(var(--error) / <alpha-value>)',
            'info': 'rgb(var(--info) / <alpha-value>)',
          },
        },
      },
    }
  </script>
</head>

<body class="bg-base-100 transition-colors duration-300">

</html>
