[build]
  command = "npm install && npm run build && cd server && npm install"
  functions = "server"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[env]
  [env.production]
    DATABASE_URL = ""
    JWT_SECRET = ""
    NODE_ENV = "production"
